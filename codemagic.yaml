workflows:
  macos-tests:
    name: macOS tests
    instance_type: mac_mini_m2
    max_build_duration: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Python version
        script: python3 --version
      - name: Python runner tests
        script: python3 -m unittest discover -s tests/py -v
      - name: Shell syntax
        script: bash -n install.sh && bash -n uninstall.sh
      - name: Install into a fake HOME, then uninstall
        script: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          bash ./install.sh --add-agents-rule
          test -x "$HOME/.claude/skills/orchestra/scripts/codex-run.py"
          bash ./install.sh --add-agents-rule
          test "$(grep -c '^<!-- orchestra:start -->' "$HOME/.claude/AGENTS.md")" = 1
          bash ./uninstall.sh
          test ! -e "$HOME/.claude/skills/orchestra"